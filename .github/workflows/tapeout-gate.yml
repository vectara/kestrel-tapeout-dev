# Tape-out gate: "CI for chips".
# Every push to a PR that changes package/ is reviewed by the Vectara tape-out gate agent (7 AI specialists).
# The AI posts statuses, line comments and a summary; "tapeout/gate" is a required check on main.
# Merge = released to the factory (environment "fab"); then the retro agent proposes rulebook amendments.
name: Tape-out gate

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["package/**"]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write        # retro agent opens a rulebook PR from a bot branch
  pull-requests: write   # review + inline comments + rulebook PR
  issues: write          # sticky summary comment, ChatOps replies
  statuses: write        # tapeout/gate + one status per AI specialist
  deployments: write     # release to the "fab" environment

concurrency:
  # one gate session per PR: never send two turns into it at once
  group: tapeout-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: AI tape-out review
    # never with secrets on fork PRs; only open/updated PRs
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the trusted runner (base branch, not the PR's code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/tapeout
      - name: Ask the Vectara tape-out gate (7 AI specialists in parallel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VECTARA_API_KEY: ${{ secrets.VECTARA_API_KEY }}
          VECTARA_BASE_URL: ${{ secrets.VECTARA_BASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .github/tapeout/gate.py review
          --pr ${{ github.event.pull_request.number }}
          --sha ${{ github.event.pull_request.head.sha }}
          --out tapeout-out
      - name: Upload the full gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tapeout-report-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: tapeout-out/

  chatops:
    name: Answer /tapeout explain
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/tapeout') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       startsWith(github.event.comment.body, '/tapeout') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the trusted runner (default branch, never the PR's code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/tapeout
      - name: Ask the reviewer in the PR's own gate session
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          VECTARA_API_KEY: ${{ secrets.VECTARA_API_KEY }}
          VECTARA_BASE_URL: ${{ secrets.VECTARA_BASE_URL }}
        run: >-
          python3 .github/tapeout/gate.py explain
          --pr ${{ github.event.issue.number || github.event.pull_request.number }}
          --comment-id ${{ github.event.comment.id }}
          --kind ${{ github.event_name == 'issue_comment' && 'issue' || 'review' }}

  release:
    name: Release to the factory
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: fab
      url: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Check out the trusted runner (default branch, never the PR's code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/tapeout
      - name: Tape-out recorded; retro agent proposes rulebook amendments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VECTARA_API_KEY: ${{ secrets.VECTARA_API_KEY }}
          VECTARA_BASE_URL: ${{ secrets.VECTARA_BASE_URL }}
        run: >-
          python3 .github/tapeout/gate.py release
          --pr ${{ github.event.pull_request.number }}
          --skip-deployment --out tapeout-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tapeout-retro-pr${{ github.event.pull_request.number }}
          path: tapeout-out/
